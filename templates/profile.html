{% extends 'base.html' %}{% block content %}<section class="narrow"><span class="pill">My profile</span><h1>Make this journey yours</h1><form novalidate id="profileForm" class="card stack"><label>Your name<input class="input" name="name" placeholder="Your name"></label><label>Current education<select class="input" name="education"><option>10th completed</option><option>In 11th</option><option>12th completed</option><option>In college</option><option>Other</option></select></label><label>Your goal<textarea class="input resize-none" name="goals" placeholder="What would you like to explore?"></textarea></label><label><input type="checkbox" name="no_math"> I did not study Mathematics</label><label><input type="checkbox" name="no_biology"> I did not study Biology</label><label><input type="checkbox" name="no_btech"> I prefer a course outside B.Tech</label><button class="button">Save profile</button><p id="saved" role="status"></p></form></section>{% endblock %}
